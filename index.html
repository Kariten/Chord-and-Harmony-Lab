<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Chord & Harmony Lab</title>
    <script>
      try {
        if (localStorage.getItem("chordLabDarkMode") === "true") {
          document.documentElement.dataset.theme = "dark";
        }
      } catch {}
    </script>
    <link rel="stylesheet" href="./styles.css?v=20260614.12" />
  </head>
  <body>
    <main class="app-shell">
      <section class="hero-band" aria-labelledby="page-title">
        <div>
          <p class="eyebrow" data-i18n="heroEyebrow">Professional Keyboard Harmony Reference</p>
          <h1 id="page-title" data-i18n="pageTitle">Chord & Harmony Lab</h1>
        </div>
        <div class="hero-meter" aria-label="当前和声状态" data-i18n-attr="aria-label:currentHarmonyState">
          <span id="heroKey">C Ionian</span>
          <strong id="heroChord">Cmaj7</strong>
        </div>
      </section>

      <section class="control-band" aria-label="和弦进行工作区" data-i18n-attr="aria-label:progressionWorkspace">
        <div class="progression-heading">
          <strong data-i18n="progression">和弦进行</strong>
          <span id="progressionCount">0</span>
        </div>
        <div id="progressionQueue" class="progression-queue" role="list" aria-label="和弦进行队列" data-i18n-attr="aria-label:progressionQueue">
          <p id="progressionEmpty" class="progression-empty" data-i18n="progressionEmpty">点击和弦卡片上的加号开始编排</p>
        </div>
        <div class="progression-actions">
          <button id="playQueue" class="queue-command primary" type="button" data-i18n="playQueue">播放进行</button>
          <button id="clearQueue" class="queue-command quiet" type="button" data-i18n="clearQueue">清空</button>
          <span class="progression-action-divider" aria-hidden="true"></span>
          <button id="settingsButton" class="settings-button" type="button" aria-expanded="false" aria-controls="settingsPopover" aria-label="全局设置" data-i18n-attr="aria-label:globalSettings">
            <img src="./settings.svg" alt="" aria-hidden="true" />
          </button>
        </div>
        <div id="settingsPopover" class="settings-popover" hidden>
          <div class="settings-heading">
            <strong data-i18n="globalSettings">全局设置</strong>
            <button id="settingsClose" class="settings-close" type="button" aria-label="关闭设置" data-i18n-attr="aria-label:closeSettings">×</button>
          </div>
          <div class="settings-grid">
            <label class="field language-field">
              <span data-i18n="language">语言</span>
              <select id="languageSelect"></select>
            </label>
            <label class="field texture-field">
              <span data-i18n="texture">织体</span>
              <select id="textureSelect"></select>
            </label>
            <label class="field bpm-field">
              <span>BPM</span>
              <span id="bpmValueLabel" class="sr-only" data-i18n="bpmValue">每分钟节拍数</span>
              <div class="bpm-control">
                <input id="bpmRange" type="range" min="40" max="240" step="1" value="150" aria-label="调整 BPM" data-i18n-attr="aria-label:bpmSlider" />
                <input id="bpmInput" type="number" min="40" max="240" step="1" value="150" inputmode="numeric" aria-labelledby="bpmValueLabel" />
              </div>
            </label>
            <label class="switch-field guitar-switch-field">
              <span data-i18n="guitarReference">吉他指法</span>
              <input id="guitarToggle" type="checkbox" checked />
              <i aria-hidden="true"></i>
            </label>
            <label class="switch-field theme-switch-field">
              <span data-i18n="darkMode">夜间模式</span>
              <input id="darkModeToggle" type="checkbox" />
              <i aria-hidden="true"></i>
            </label>
            <label class="field midi-field">
              <span data-i18n="midiInput">MIDI 输入</span>
              <select id="midiInputSelect" disabled>
                <option value="" data-i18n="midiInitial">未启用</option>
              </select>
            </label>
            <button id="midiEnable" class="command midi-command" type="button" data-i18n="enableMidi">启用 MIDI</button>
          </div>
        </div>
      </section>

      <section class="workspace-grid">
        <section class="harmony-panel" aria-labelledby="harmony-title">
          <div class="panel-heading">
            <div>
              <p class="eyebrow" data-i18n="diatonicHarmony">Diatonic Harmony</p>
              <h2 id="harmony-title" data-i18n="degreeChords">各级和弦</h2>
            </div>
            <p id="modeFormula" class="formula-line"></p>
          </div>
          <div class="degree-controls" aria-label="调性与和弦控制" data-i18n-attr="aria-label:harmonyControls">
            <label class="field">
              <span data-i18n="key">主音</span>
              <select id="keySelect"></select>
            </label>
            <label class="field">
              <span data-i18n="mode">调式</span>
              <select id="modeSelect"></select>
            </label>
            <div class="segmented" role="group" aria-label="和弦层级" data-i18n-attr="aria-label:chordLevel">
              <button id="triadButton" class="segment" type="button" data-i18n="triads">三和弦</button>
              <button id="seventhButton" class="segment active" type="button" data-i18n="sevenths">七和弦</button>
            </div>
            <button id="playProgression" class="command primary" type="button" data-i18n="playProgression">播放级数</button>
          </div>
          <div id="degreeGrid" class="degree-grid"></div>
        </section>

        <aside class="analysis-panel" aria-labelledby="analysis-title">
          <div class="panel-heading compact">
            <div>
              <p class="eyebrow" data-i18n="chordIdentity">Chord Identity</p>
              <h2 id="analysis-title" data-i18n="chordRecognition">和弦识别</h2>
            </div>
          </div>
          <div class="analysis-tabs" role="tablist" aria-label="和弦参考视图" data-i18n-attr="aria-label:analysisViews">
            <button id="toneViewButton" class="analysis-tab active" type="button" role="tab" aria-controls="toneView" aria-selected="true" data-i18n="toneView">构成音</button>
            <button id="guitarViewButton" class="analysis-tab" type="button" role="tab" aria-controls="guitarView" aria-selected="false" data-i18n="guitarView">吉他指法</button>
          </div>
          <div id="toneView" class="analysis-scroll analysis-view active" role="tabpanel" aria-labelledby="toneViewButton">
            <div class="analysis-display">
              <div class="analysis-note-line">
                <p id="manualNotes" class="note-row" data-i18n="noKeysSelected">未选择琴键</p>
                <button id="addDetectedChord" class="add-chord-button" type="button" aria-label="添加和弦" data-i18n-attr="aria-label:addChord">+</button>
              </div>
              <div class="detected-line">
                <strong id="detectedName" class="detected-name">-</strong>
                <div class="detected-actions">
                  <button id="playSelected" class="command primary analysis-play-button" type="button" data-i18n="play">试听</button>
                </div>
              </div>
              <p id="detectedFormula" class="formula-line" data-i18n="pickKeysHint">在下方钢琴点选音符后自动识别。</p>
            </div>
            <div>
              <h3 data-i18n="aliases">别名 / 近似视角</h3>
              <div id="aliasList" class="alias-list"></div>
            </div>
            <div class="tone-map">
              <h3 data-i18n="currentChordTones">当前和弦构成</h3>
              <div id="toneMap" class="tone-map-grid"></div>
            </div>
          </div>
          <div id="guitarView" class="analysis-scroll analysis-view guitar-view" role="tabpanel" aria-labelledby="guitarViewButton" hidden>
            <div class="guitar-summary">
              <div class="guitar-title-row">
                <h3 data-i18n="guitarVoicingsTitle">吉他指法参考</h3>
                <button id="guitarTipButton" class="info-tip-button" type="button" aria-expanded="false" aria-describedby="guitarTipBubble" aria-label="吉他指法提示" data-i18n-attr="aria-label:guitarTipLabel">i</button>
                <span id="guitarTipBubble" class="info-tip-bubble" role="tooltip" data-i18n="guitarTipText">吉他和弦指法由程序生成，可能存在不合理/无法实现的指法，仅供参考</span>
              </div>
              <p id="guitarSummary" class="formula-line"></p>
            </div>
            <div id="guitarVoicingList" class="guitar-voicing-list"></div>
          </div>
        </aside>
      </section>

      <section class="piano-band" aria-label="钢琴示例">
        <div class="piano-toolbar">
          <div>
            <p class="eyebrow" data-i18n="pianoEyebrow">Interactive Piano</p>
            <h2 data-i18n="pianoTitle">高亮钢琴示例</h2>
          </div>
          <div id="pianoLegend" class="legend">
            <span><i class="legend-current"></i><span data-i18n="degreeChordLegend">级数和弦</span></span>
            <span><i class="legend-picked"></i><span data-i18n="manualLegend">手动选键</span></span>
            <span><i class="legend-midi"></i><span data-i18n="midiLegend">MIDI 输入</span></span>
            <span><i class="legend-root"></i><span data-i18n="rootLegend">根音</span></span>
            <span class="legend-divider" aria-hidden="true"></span>
            <button id="clearSelection" class="clear-selection-button" type="button" title="清空选键" aria-label="清空选键" data-i18n-attr="title:clearSelection;aria-label:clearSelection">
              <span data-i18n="clearSelection">清空选键</span>
            </button>
          </div>
        </div>
        <div id="piano" class="piano" role="group" aria-label="可点击钢琴键盘" data-i18n-attr="aria-label:pianoLabel"></div>
      </section>
    </main>

    <script type="module" src="./src/app.js?v=20260614.5"></script>
  </body>
</html>
