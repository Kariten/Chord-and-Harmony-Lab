<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Chord & Harmony Lab</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="hero-band" aria-labelledby="page-title">
        <div>
          <p class="eyebrow" data-i18n="heroEyebrow">Professional Keyboard Harmony Reference</p>
          <h1 id="page-title" data-i18n="pageTitle">Chord & Harmony Lab</h1>
        </div>
        <div class="hero-meter" aria-label="当前和声状态" data-i18n-attr="aria-label:currentHarmonyState">
          <span id="heroKey">C Ionian</span>
          <strong id="heroChord">Cmaj7</strong>
        </div>
      </section>

      <section class="control-band" aria-label="调性与和弦控制">
        <label class="field">
          <span data-i18n="key">主音</span>
          <select id="keySelect"></select>
        </label>
        <label class="field">
          <span data-i18n="mode">调式</span>
          <select id="modeSelect"></select>
        </label>
        <div class="segmented" role="group" aria-label="和弦层级" data-i18n-attr="aria-label:chordLevel">
          <button id="triadButton" class="segment" type="button" data-i18n="triads">三和弦</button>
          <button id="seventhButton" class="segment active" type="button" data-i18n="sevenths">七和弦</button>
        </div>
        <button id="playProgression" class="command primary" type="button" data-i18n="playProgression">播放级数</button>
        <button id="clearSelection" class="command" type="button" data-i18n="clearSelection">清空选键</button>
        <label class="field language-field">
          <span data-i18n="language">语言</span>
          <select id="languageSelect"></select>
        </label>
        <label class="field midi-field">
          <span data-i18n="midiInput">MIDI 输入</span>
          <select id="midiInputSelect" disabled>
            <option value="" data-i18n="midiInitial">未启用</option>
          </select>
        </label>
        <button id="midiEnable" class="command midi-command" type="button" data-i18n="enableMidi">启用 MIDI</button>
      </section>

      <section class="workspace-grid">
        <section class="harmony-panel" aria-labelledby="harmony-title">
          <div class="panel-heading">
            <div>
              <p class="eyebrow" data-i18n="diatonicHarmony">Diatonic Harmony</p>
              <h2 id="harmony-title" data-i18n="degreeChords">各级和弦</h2>
            </div>
            <p id="modeFormula" class="formula-line"></p>
          </div>
          <div id="degreeGrid" class="degree-grid"></div>
        </section>

        <aside class="analysis-panel" aria-labelledby="analysis-title">
          <div class="panel-heading compact">
            <div>
              <p class="eyebrow" data-i18n="chordIdentity">Chord Identity</p>
              <h2 id="analysis-title" data-i18n="chordRecognition">和弦识别</h2>
            </div>
          </div>
          <div class="analysis-tabs" role="tablist" aria-label="和弦参考视图" data-i18n-attr="aria-label:analysisViews">
            <button id="toneViewButton" class="analysis-tab active" type="button" role="tab" aria-controls="toneView" aria-selected="true" data-i18n="toneView">构成音</button>
            <button id="guitarViewButton" class="analysis-tab" type="button" role="tab" aria-controls="guitarView" aria-selected="false" data-i18n="guitarView">吉他指法</button>
          </div>
          <div id="toneView" class="analysis-scroll analysis-view active" role="tabpanel" aria-labelledby="toneViewButton">
            <div class="analysis-display">
              <p id="manualNotes" class="note-row" data-i18n="noKeysSelected">未选择琴键</p>
              <strong id="detectedName" class="detected-name">-</strong>
              <p id="detectedFormula" class="formula-line" data-i18n="pickKeysHint">在下方钢琴点选音符后自动识别。</p>
            </div>
            <div>
              <h3 data-i18n="aliases">别名 / 近似视角</h3>
              <div id="aliasList" class="alias-list"></div>
            </div>
            <div class="tone-map">
              <h3 data-i18n="currentChordTones">当前和弦构成</h3>
              <div id="toneMap" class="tone-map-grid"></div>
            </div>
          </div>
          <div id="guitarView" class="analysis-scroll analysis-view guitar-view" role="tabpanel" aria-labelledby="guitarViewButton" hidden>
            <div class="guitar-summary">
              <h3 data-i18n="guitarVoicingsTitle">吉他指法参考</h3>
              <p id="guitarSummary" class="formula-line"></p>
            </div>
            <div id="guitarVoicingList" class="guitar-voicing-list"></div>
          </div>
          <button id="playSelected" class="command primary wide" type="button" data-i18n="playSelected">播放所选</button>
        </aside>
      </section>

      <section class="piano-band" aria-label="钢琴示例">
        <div class="piano-toolbar">
          <div>
            <p class="eyebrow" data-i18n="pianoEyebrow">Interactive Piano</p>
            <h2 data-i18n="pianoTitle">高亮钢琴示例</h2>
          </div>
          <div id="pianoLegend" class="legend">
            <span><i class="legend-current"></i><span data-i18n="degreeChordLegend">级数和弦</span></span>
            <span><i class="legend-picked"></i><span data-i18n="manualLegend">手动选键</span></span>
            <span><i class="legend-midi"></i><span data-i18n="midiLegend">MIDI 输入</span></span>
            <span><i class="legend-root"></i><span data-i18n="rootLegend">根音</span></span>
          </div>
        </div>
        <div id="piano" class="piano" role="group" aria-label="可点击钢琴键盘" data-i18n-attr="aria-label:pianoLabel"></div>
      </section>
    </main>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
